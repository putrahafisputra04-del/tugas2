```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin | Pisshop</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#4E342E,#8D6E63);
}

.login-box{
width:400px;
background:#fff;
padding:40px;
border-radius:18px;
box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
text-align:center;
margin-bottom:30px;
}

.logo .icon{
width:90px;
height:90px;
margin:auto;
border-radius:50%;
background:#6F4E37;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:38px;
}

.logo h1{
margin-top:15px;
color:#6F4E37;
}

.logo p{
margin-top:5px;
color:#777;
font-size:14px;
}

.input-group{
margin-bottom:18px;
}

.input-group label{
display:block;
margin-bottom:8px;
font-weight:bold;
color:#555;
}

.input-box{
position:relative;
}

.input-box i{
position:absolute;
left:15px;
top:50%;
transform:translateY(-50%);
color:#888;
}

.input-box input{
width:100%;
padding:14px 15px 14px 45px;
border:1px solid #ccc;
border-radius:10px;
outline:none;
font-size:15px;
transition:.3s;
}

.input-box input:focus{
border-color:#6F4E37;
box-shadow:0 0 8px rgba(111,78,55,.3);
}

.show-pass{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
color:#777;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
font-weight:bold;
margin-top:10px;
transition:.3s;
}

.login-btn{
background:#6F4E37;
color:white;
}

.login-btn:hover{
background:#553A29;
}

.back-btn{
background:#ddd;
color:#333;
}

.back-btn:hover{
background:#c5c5c5;
}

.demo{
margin-top:20px;
padding:12px;
background:#f7f7f7;
border-left:5px solid #6F4E37;
border-radius:8px;
font-size:13px;
}

.footer{
text-align:center;
margin-top:20px;
font-size:12px;
color:#888;
}

</style>

</head>

<body>


<div class="login-box">

<div class="logo">

<div class="icon">
<i class="fas fa-user-shield"></i>
</div>

<h1>Pisshop Admin</h1>

<p>Silakan login ke Dashboard Admin</p>

</div>

<form id="loginForm">

<div class="input-group">

<label>Username</label>

<div class="input-box">

<i class="fas fa-user"></i>

<input
type="text"
id="username"
placeholder="Masukkan Username"
required>

</div>

</div>

<div class="input-group">

<label>Password</label>

<div class="input-box">

<i class="fas fa-lock"></i>

<input
type="password"
id="password"
placeholder="Masukkan Password"
required>

<i class="fas fa-eye show-pass"
onclick="togglePassword()"></i>

</div>

</div>

<button class="login-btn" type="submit">

<i class="fas fa-right-to-bracket"></i>
Login Admin

</button>

<button
type="button"
class="back-btn"
onclick="location.href='login.html'">

Kembali

</button>

</form>

<div class="demo">

<b>Demo Login</b><br><br>

Username : <b>admin</b><br>
Password : <b>admin123</b>

</div>

<div class="footer">

© 2026 Pisshop

</div>

</div>

<script>

function togglePassword(){

let pass=document.getElementById("password");

if(pass.type==="password"){
pass.type="text";
}else{
pass.type="password";
}

}

document.getElementById("loginForm").addEventListener("submit", function(e){

    e.preventDefault();

    let username = document.getElementById("username").value.trim();
    let password = document.getElementById("password").value.trim();

    // Cek apakah ada yang kosong
    if(username === "" || password === ""){
        alert("Username dan Password wajib diisi!");
        return;
    }

    // Login
    if(username === "admin" && password === "admin123"){

        alert("Login Admin Berhasil");
        window.location.href = "halamanadmin.html";

    }else{

        alert("Username atau Password Salah");

    }

});

</script>

</body>
</html>
```
