<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pisshop - Toko Online</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Segoe UI',Arial,sans-serif;
}

:root{
    --brown:#6F4E37;
    --brown-dark:#5A3E2B;
    --brown-light:#A67C52;
}

body{
    background:#f5f5f5;
    color:#333;
}

/* HEADER */
header{
    background:var(--brown);
    color:white;
    padding:12px 20px;
    position:sticky;
    top:0;
    z-index:100;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.brand{
    font-size:22px;
    font-weight:bold;
    display:flex;
    align-items:center;
    gap:10px;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.header-btn{
    border:none;
    padding:8px 12px;
    border-radius:20px;
    cursor:pointer;
    font-weight:bold;
}

.order-btn{
    background:white;
    color:var(--brown);
}

.cart-btn{
    position:relative;
    background:var(--brown-light);
    color:#222;
}

.logout-btn{
    background:#dc3545;
    color:white;
}

.badge{
    position:absolute;
    top:-7px;
    right:-7px;
    min-width:20px;
    height:20px;
    padding:2px 5px;
    border-radius:50%;
    background:#dc3545;
    color:white;
    font-size:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid white;
}

/* CONTAINER */
.container{
    max-width:1100px;
    margin:20px auto;
    padding:0 15px;
}

/* KATEGORI */
.category-dashboard{
    display:flex;
    gap:12px;
    overflow-x:auto;
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.category-item{
    min-width:90px;
    text-align:center;
    cursor:pointer;
    padding:12px;
    border-radius:10px;
    transition:.3s;
}

.category-item i{
    display:block;
    font-size:25px;
    color:var(--brown);
    margin-bottom:8px;
}

.category-item span{
    font-size:13px;
    font-weight:bold;
}

.category-item:hover,
.category-item.active{
    background:var(--brown);
    color:white;
}

.category-item:hover i,
.category-item.active i{
    color:white;
}

/* JUDUL */
.section-title{
    color:var(--brown);
    font-weight:bold;
    margin-bottom:15px;
    font-size:17px;
}

/* GRID */
.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:15px;
}

/* CARD */
.product-card{
    background:white;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 2px 7px rgba(0,0,0,.08);
    transition:.2s;
}

.product-card:hover{
    transform:translateY(-4px);
    box-shadow:0 7px 18px rgba(0,0,0,.14);
}

.product-img-box{
    height:180px;
    position:relative;
}

.product-img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.badge-category{
    position:absolute;
    top:8px;
    left:8px;
    background:var(--brown);
    color:white;
    padding:4px 7px;
    border-radius:4px;
    font-size:10px;
    font-weight:bold;
}

.product-info{
    padding:12px;
}

.product-title{
    font-size:14px;
    font-weight:bold;
    height:38px;
    overflow:hidden;
}

.product-price{
    color:var(--brown);
    font-size:17px;
    font-weight:bold;
    margin:8px 0 12px;
}

.button-group{
    display:flex;
    gap:6px;
}

.btn-cart,
.btn-buy{
    flex:1;
    border:none;
    padding:9px 5px;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
    font-size:11px;
}

.btn-cart{
    background:var(--brown-light);
}

.btn-buy{
    background:var(--brown);
    color:white;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    z-index:1000;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.modal.active{
    display:flex;
}

.modal-card{
    background:white;
    width:100%;
    max-width:500px;
    max-height:92vh;
    overflow-y:auto;
    border-radius:12px;
    padding:20px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #eee;
    padding-bottom:12px;
    margin-bottom:15px;
}

.modal-header h3{
    color:var(--brown);
}

.close{
    border:none;
    background:none;
    font-size:25px;
    cursor:pointer;
}

/* VIDEO */
.video-title{
    color:var(--brown);
    font-weight:bold;
    margin:12px 0 7px;
}

.product-video{
    width:100%;
    height:230px;
    object-fit:cover;
    border-radius:8px;
    background:#111;
}

/* FORM */
.form-group{
    margin-bottom:12px;
}

.form-group label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-bottom:5px;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:6px;
    outline:none;
}

.submit-btn{
    width:100%;
    border:none;
    background:var(--brown);
    color:white;
    padding:11px;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

/* CART */
.cart-item{
    display:flex;
    gap:10px;
    align-items:center;
    padding:10px 0;
    border-bottom:1px dashed #ddd;
}

.cart-item img{
    width:55px;
    height:55px;
    object-fit:cover;
    border-radius:6px;
}

.cart-info{
    flex:1;
    font-size:12px;
}

.remove-btn{
    border:none;
    background:none;
    color:#dc3545;
    cursor:pointer;
}

/* TOAST */
.toast{
    position:fixed;
    top:-70px;
    left:50%;
    transform:translateX(-50%);
    background:#28a745;
    color:white;
    padding:12px 22px;
    border-radius:30px;
    z-index:9999;
    font-weight:bold;
    transition:.4s;
}

.toast.show{
    top:20px;
}

/* RESPONSIVE */
@media(max-width:600px){
    .brand{
        font-size:18px;
    }

    .header-actions{
        gap:5px;
    }

    .header-btn{
        padding:7px 9px;
        font-size:11px;
    }

    .product-grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .product-img-box{
        height:150px;
    }
}
</style>
</head>

<body>

<!-- TOAST -->
<div class="toast" id="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toastText">Berhasil!</span>
</div>

<!-- HEADER -->
<header>

    <div class="brand">
        <i class="fas fa-bag-shopping"></i>
        Pisshop
    </div>

    <div class="header-actions">

        <button class="header-btn order-btn"
                onclick="openOrders()">
            <i class="fas fa-box"></i>
            Pesanan
            <span class="badge" id="orderBadge">0</span>
        </button>

        <button class="header-btn cart-btn"
                onclick="openCart()">
            <i class="fas fa-cart-shopping"></i>
            Keranjang
            <span class="badge" id="cartBadge">0</span>
        </button>

        <button class="header-btn logout-btn"
                onclick="logout()">
            <i class="fas fa-sign-out-alt"></i>
            Logout
        </button>

    </div>
</header>


<!-- KONTEN -->
<div class="container">

    <!-- KATEGORI -->
    <div class="category-dashboard">

        <div class="category-item active"
             onclick="filterProducts('Semua',this)">
            <i class="fas fa-store"></i>
            <span>Semua</span>
        </div>

        <div class="category-item"
             onclick="filterProducts('Baju',this)">
            <i class="fas fa-shirt"></i>
            <span>Baju</span>
        </div>

        <div class="category-item"
             onclick="filterProducts('Sepatu',this)">
            <i class="fas fa-shoe-prints"></i>
            <span>Sepatu</span>
        </div>

        <div class="category-item"
             onclick="filterProducts('Aksesoris',this)">
            <i class="fas fa-gem"></i>
            <span>Aksesoris</span>
        </div>

        <div class="category-item"
             onclick="filterProducts('Tas',this)">
            <i class="fas fa-bag-shopping"></i>
            <span>Tas</span>
        </div>

        <div class="category-item"
             onclick="filterProducts('Olahraga',this)">
            <i class="fas fa-dumbbell"></i>
            <span>Olahraga</span>
        </div>

        <div class="category-item"
             onclick="filterProducts('Elektronik',this)">
            <i class="fas fa-headphones"></i>
            <span>Elektronik</span>
        </div>

    </div>


    <div class="section-title">
        <i class="fas fa-bolt"></i>
        KATALOG PRODUK PISSHOP
    </div>

    <div class="product-grid" id="productGrid"></div>

</div>


<!-- MODAL BELI -->
<div class="modal" id="buyModal">

    <div class="modal-card">

        <div class="modal-header">

            <h3>
                <i class="fas fa-bag-shopping"></i>
                Checkout Produk
            </h3>

            <button class="close"
                    onclick="closeBuy()">
                &times;
            </button>

        </div>

        <div id="buyProductInfo"></div>

        <div class="video-title">
            <i class="fas fa-video"></i>
            Video Produk
        </div>

        <video id="productVideo"
               class="product-video"
               controls
               playsinline>
            <source id="videoSource"
                    src=""
                    type="video/mp4">
            Browser tidak mendukung video.
        </video>

        <br>

        <form onsubmit="checkout(event)">

            <div class="form-group">
                <label>Jumlah Item</label>
                <input type="number"
                       id="qty"
                       min="1"
                       value="1"
                       oninput="updateTotal()"
                       required>
            </div>

            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text"
                       id="name"
                       placeholder="Nama pembeli"
                       required>
            </div>

            <div class="form-group">
                <label>Nomor WhatsApp</label>
                <input type="tel"
                       id="phone"
                       placeholder="08123456789"
                       required>
            </div>

            <div class="form-group">
                <label>Alamat</label>
                <textarea id="address"
                          rows="3"
                          placeholder="Alamat lengkap"
                          required></textarea>
            </div>

            <div style="margin-bottom:12px;font-weight:bold;">
                Total:
                <span id="total"
                      style="color:#6F4E37">
                    Rp 0
                </span>
            </div>

            <button class="submit-btn"
                    type="submit">
                <i class="fas fa-check"></i>
                Konfirmasi Pesanan
            </button>

        </form>

    </div>
</div>


<!-- MODAL KERANJANG -->
<div class="modal" id="cartModal">

    <div class="modal-card">

        <div class="modal-header">

            <h3>
                <i class="fas fa-cart-shopping"></i>
                Keranjang Saya
            </h3>

            <button class="close"
                    onclick="closeCart()">
                &times;
            </button>

        </div>

        <div id="cartList"></div>

        <div id="cartCheckout"
             style="display:none">

            <hr><br>

            <b>
                Total:
                <span id="cartTotal"
                      style="color:#6F4E37">
                    Rp 0
                </span>
            </b>

            <br><br>

            <form onsubmit="checkoutCart(event)">

                <div class="form-group">
                    <label>Nama</label>
                    <input id="cartName"
                           required>
                </div>

                <div class="form-group">
                    <label>Nomor WhatsApp</label>
                    <input id="cartPhone"
                           required>
                </div>

                <div class="form-group">
                    <label>Alamat</label>
                    <textarea id="cartAddress"
                              required></textarea>
                </div>

                <button class="submit-btn">
                    Checkout Semua
                </button>

            </form>

        </div>

    </div>
</div>


<!-- MODAL PESANAN -->
<div class="modal" id="ordersModal">

    <div class="modal-card">

        <div class="modal-header">

            <h3>
                <i class="fas fa-box"></i>
                Pesanan Saya
            </h3>

            <button class="close"
                    onclick="closeOrders()">
                &times;
            </button>

        </div>

        <div id="ordersList"></div>

    </div>

</div>


<script>

/* ==========================================
   DATA PRODUK
   ========================================== */

const defaultProducts = [

    {
        id:1,
        title:"Kaos Oversize Premium",
        price:75000,
        category:"Baju",
        img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600",
        video:"video/kaos.mp4"
    },

    {
        id:2,
        title:"Hoodie Premium Casual",
        price:125000,
        category:"Baju",
        img:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=600",
        video:"video/hoodie.mp4"
    },

    {
        id:3,
        title:"Sneakers Casual",
        price:250000,
        category:"Sepatu",
        img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600",
        video:"video/sepatu.mp4"
    },

    {
        id:4,
        title:"Sepatu Sport Running",
        price:325000,
        category:"Sepatu",
        img:"https://images.unsplash.com/photo-1551107696-a4b0c5a0d9a2?w=600",
        video:"video/sepatu.mp4"
    },

    {
        id:5,
        title:"Jam Tangan Casual",
        price:150000,
        category:"Aksesoris",
        img:"https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=600",
        video:"video/aksesoris.mp4"
    },

    {
        id:6,
        title:"Kacamata Fashion",
        price85000,
        category:"Aksesoris",
        img:"https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=600",
        video:"video/aksesoris.mp4"
    },

    {
        id:7,
        title:"Tas Selempang Pria",
        price:95000,
        category:"Tas",
        img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=600",
        video:"video/tas.mp4"
    },

    {
        id:8,
        title:"Tas Backpack Casual",
        price:175000,
        category:"Tas",
        img:"https://images.unsplash.com/photo-1551632811-561732d1e306?w=600",
        video:"video/tas.mp4"
    },

    {
        id:9,
        title:"Bola Sepak Premium",
        price:120000,
        category:"Olahraga",
        img:"https://images.unsplash.com/photo-1614632537190-23e4146777db?w=600",
        video:"video/olahraga.mp4"
    },

    {
        id:10,
        title:"Dumbbell Fitness",
        price:180000,
        category:"Olahraga",
        img:"https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?w=600",
        video:"video/olahraga.mp4"
    },

    {
        id:11,
        title:"Headphone Bluetooth",
        price:225000,
        category:"Elektronik",
        img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600",
        video:"video/elektronik.mp4"
    },

    {
        id:12,
        title:"Smartwatch Digital",
        price:350000,
        category:"Elektronik",
        img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600",
        video:"video/elektronik.mp4"
    }

];


/* ==========================================
   PRODUK DARI ADMIN
   ========================================== */

function getAdminProducts(){

    try{

        const data =
            JSON.parse(
                localStorage.getItem("pisshop_products")
            ) || [];

        return Array.isArray(data) ? data : [];

    }catch(e){

        return [];

    }

}

let products = [
    ...defaultProducts,
    ...getAdminProducts()
];


/* ==========================================
   KERANJANG
   ========================================== */

let cart =
    JSON.parse(
        localStorage.getItem("sopy_customer_cart")
    ) || [];

let activeProduct = null;


/* ==========================================
   RENDER PRODUK
   ========================================== */

function renderProducts(data=products){

    const grid =
        document.getElementById("productGrid");

    grid.innerHTML = data.map(p=>`

        <div class="product-card">

            <div class="product-img-box">

                <span class="badge-category">
                    ${p.category}
                </span>

                <img
                    src="${p.img}"
                    class="product-img"
                    alt="${p.title}">

            </div>

            <div class="product-info">

                <div class="product-title">
                    ${p.title}
                </div>

                <div class="product-price">
                    Rp ${Number(p.price).toLocaleString("id-ID")}
                </div>

                <div class="button-group">

                    <button
                        class="btn-cart"
                        onclick="addCart(${p.id})">

                        <i class="fas fa-cart-plus"></i>
                        +Keranjang

                    </button>

                    <button
                        class="btn-buy"
                        onclick="openBuy(${p.id})">

                        <i class="fas fa-bag-shopping"></i>
                        Beli

                    </button>

                </div>

            </div>

        </div>

    `).join("");

    updateCartBadge();

}


/* ==========================================
   FILTER
   ========================================== */

function filterProducts(category,element){

    document
        .querySelectorAll(".category-item")
        .forEach(x=>x.classList.remove("active"));

    element.classList.add("active");

    if(category==="Semua"){

        renderProducts(products);

    }else{

        renderProducts(
            products.filter(
                p=>p.category===category
            )
        );

    }

}


/* ==========================================
   TAMBAH KERANJANG
   ========================================== */

function addCart(id){

    const product =
        products.find(p=>p.id===id);

    if(!product)return;

    const existing =
        cart.find(p=>p.id===id);

    if(existing){

        existing.qty++;

    }else{

        cart.push({
            ...product,
            qty:1
        });

    }

    saveCart();

    showToast(
        "Produk berhasil masuk keranjang!"
    );

}


/* ==========================================
   STORAGE CART
   ========================================== */

function saveCart(){

    localStorage.setItem(
        "sopy_customer_cart",
        JSON.stringify(cart)
    );

    updateCartBadge();

}


/* ==========================================
   BADGE
   ========================================== */

function updateCartBadge(){

    const total =
        cart.reduce(
            (sum,item)=>sum+item.qty,
            0
        );

    document.getElementById(
        "cartBadge"
    ).innerText=total;

}


/* ==========================================
   BELI SEKARANG
   ========================================== */

function openBuy(id){

    activeProduct =
        products.find(p=>p.id===id);

    if(!activeProduct)return;

    document.getElementById(
        "buyProductInfo"
    ).innerHTML=`

        <div style="
            background:#fff8e6;
            padding:12px;
            border-radius:7px;
            border-left:4px solid #6F4E37;
        ">

            <b>${activeProduct.title}</b>

            <br>

            Harga:
            <b style="color:#6F4E37">
                Rp ${activeProduct.price.toLocaleString("id-ID")}
            </b>

        </div>

    `;


    /* VIDEO PRODUK */

    const video =
        document.getElementById(
            "productVideo"
        );

    const source =
        document.getElementById(
            "videoSource"
        );

    source.src =
        activeProduct.video ||
        "video/produk.mp4";

    video.load();


    document.getElementById(
        "qty"
    ).value=1;

    updateTotal();

    document
        .getElementById("buyModal")
        .classList.add("active");

}


function closeBuy(){

    const modal =
        document.getElementById("buyModal");

    modal.classList.remove("active");

    const video =
        document.getElementById("productVideo");

    video.pause();

}


/* ==========================================
   TOTAL BELI
   ========================================== */

function updateTotal(){

    if(!activeProduct)return;

    const qty =
        Number(
            document.getElementById("qty").value
        ) || 1;

    const total =
        activeProduct.price*qty;

    document.getElementById(
        "total"
    ).innerText =
        "Rp "+
        total.toLocaleString("id-ID");

}


/* ==========================================
   CHECKOUT LANGSUNG
   ========================================== */

function checkout(event){

    event.preventDefault();

    const qty =
        Number(
            document.getElementById("qty").value
        );

    const order={

        id:
            "ORD-"+Date.now(),

        buyer:
            document.getElementById("name").value,

        phone:
            document.getElementById("phone").value,

        address:
            document.getElementById("address").value,

        productTitle:
            activeProduct.title,

        itemsCount:
            qty,

        total:
            activeProduct.price*qty,

        status:
            "Dikemas",

        time:
            new Date().toLocaleString("id-ID")

    };


    const orders =
        JSON.parse(
            localStorage.getItem("shopee_orders")
        ) || [];

    orders.unshift(order);

    localStorage.setItem(
        "shopee_orders",
        JSON.stringify(orders)
    );


    document.querySelector(
        "#buyModal form"
    ).reset();

    closeBuy();

    updateOrderBadge();

    showToast(
        "Pesanan berhasil dibuat!"
    );

}


/* ==========================================
   CART MODAL
   ========================================== */

function openCart(){

    renderCart();

    document
        .getElementById("cartModal")
        .classList.add("active");

}

function closeCart(){

    document
        .getElementById("cartModal")
        .classList.remove("active");

}


function renderCart(){

    const list =
        document.getElementById("cartList");

    const checkout =
        document.getElementById("cartCheckout");

    if(cart.length===0){

        list.innerHTML=`
            <div style="
                text-align:center;
                padding:30px;
                color:#888;
            ">
                <i class="fas fa-cart-shopping"
                   style="font-size:40px">
                </i>

                <br><br>

                Keranjang masih kosong.
            </div>
        `;

        checkout.style.display="none";

        return;

    }

    checkout.style.display="block";

    let total=0;

    list.innerHTML =
        cart.map((item,index)=>{

            const subtotal =
                item.price*item.qty;

            total+=subtotal;

            return `

                <div class="cart-item">

                    <img src="${item.img}">

                    <div class="cart-info">

                        <b>
                            ${item.title}
                        </b>

                        <br>

                        Rp ${item.price.toLocaleString("id-ID")}
                        × ${item.qty}

                        <br>

                        <b>
                            Rp ${subtotal.toLocaleString("id-ID")}
                        </b>

                    </div>

                    <button
                        class="remove-btn"
                        onclick="removeCart(${index})">

                        <i class="fas fa-trash"></i>

                    </button>

                </div>

            `;

        }).join("");


    document.getElementById(
        "cartTotal"
    ).innerText =
        "Rp "+
        total.toLocaleString("id-ID");

}


function removeCart(index){

    cart.splice(index,1);

    saveCart();

    renderCart();

}


/* ==========================================
   CHECKOUT CART
   ========================================== */

function checkoutCart(event){

    event.preventDefault();

    const name =
        document.getElementById("cartName").value;

    const phone =
        document.getElementById("cartPhone").value;

    const address =
        document.getElementById("cartAddress").value;


    const orders =
        JSON.parse(
            localStorage.getItem("shopee_orders")
        ) || [];


    cart.forEach(item=>{

        orders.unshift({

            id:"ORD-"+Date.now()+Math.floor(Math.random()*100),

            buyer:name,

            phone:phone,

            address:address,

            productTitle:item.title,

            itemsCount:item.qty,

            total:item.price*item.qty,

            status:"Dikemas",

            time:new Date().toLocaleString("id-ID")

        });

    });


    localStorage.setItem(
        "shopee_orders",
        JSON.stringify(orders)
    );


    cart=[];

    saveCart();

    closeCart();

    updateOrderBadge();

    showToast(
        "Semua pesanan berhasil dikirim!"
    );

}


/* ==========================================
   PESANAN
   ========================================== */

function openOrders(){

    const orders =
        JSON.parse(
            localStorage.getItem("shopee_orders")
        ) || [];

    const list =
        document.getElementById("ordersList");


    if(orders.length===0){

        list.innerHTML=`

            <div style="
                text-align:center;
                padding:30px;
                color:#888;
            ">

                <i class="fas fa-box-open"
                   style="font-size:40px">
                </i>

                <br><br>

                Belum ada pesanan.

            </div>

        `;

    }else{

        list.innerHTML =
            orders.map(order=>`

                <div style="
                    border:1px solid #eee;
                    padding:12px;
                    border-radius:8px;
                    margin-bottom:10px;
                ">

                    <b>
                        ${order.productTitle}
                    </b>

                    <br>

                    Jumlah:
                    ${order.itemsCount}

                    <br>

                    Total:
                    <b style="color:#6F4E37">
                        Rp ${Number(order.total)
                        .toLocaleString("id-ID")}
                    </b>

                    <br>

                    <small>
                        ${order.time}
                    </small>

                    <br><br>

                    <span style="
                        background:#fff3cd;
                        color:#856404;
                        padding:4px 8px;
                        border-radius:5px;
                        font-size:11px;
                    ">
                        ${order.status}
                    </span>

                </div>

            `).join("");

    }


    document
        .getElementById("ordersModal")
        .classList.add("active");

}


function closeOrders(){

    document
        .getElementById("ordersModal")
        .classList.remove("active");

}


function updateOrderBadge(){

    const orders =
        JSON.parse(
            localStorage.getItem("shopee_orders")
        ) || [];

    document.getElementById(
        "orderBadge"
    ).innerText=orders.length;

}


/* ==========================================
   TOAST
   ========================================== */

function showToast(message){

    document.getElementById(
        "toastText"
    ).innerText=message;

    const toast =
        document.getElementById("toast");

    toast.classList.add("show");

    setTimeout(
        ()=>toast.classList.remove("show"),
        3000
    );

}


/* ==========================================
   LOGOUT
   ========================================== */

function logout(){

    if(confirm(
        "Apakah Anda yakin ingin logout?"
    )){

        localStorage.removeItem(
            "customer_logged_in"
        );

        localStorage.removeItem(
            "admin_logged_in"
        );

        window.location.href="login.html";

    }

}


/* ==========================================
   UPDATE PRODUK DARI ADMIN
   ========================================== */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key==="pisshop_products"
        ){

            products=[
                ...defaultProducts,
                ...getAdminProducts()
            ];

            renderProducts();

        }

        if(
            event.key==="shopee_orders"
        ){

            updateOrderBadge();

        }

    }
);


/* ==========================================
   START
   ========================================== */

renderProducts();

updateCartBadge();

updateOrderBadge();

</script>
