<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin Pisshop</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#eef1f7;
    color:#333;
}

.container{
    width:98%;
    max-width:1400px;
    margin:20px auto;
}

/* HEADER */

.header{
    background:#7a563b;
    min-height:64px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 20px;
    color:white;
    gap:15px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:18px;
    font-weight:bold;
}

.logo i{
    font-size:25px;
}

.header-right{
    display:flex;
    gap:10px;
}

.btn{
    border:none;
    padding:9px 18px;
    border-radius:5px;
    cursor:pointer;
    font-size:14px;
}

.logout{
    background:white;
    color:#6d472d;
    font-weight:bold;
}

.tutup{
    background:#5f402c;
    color:white;
}

.btn:hover,
.delete:hover,
.btn-add-product:hover{
    opacity:.9;
}

/* STATISTIK */

.cards{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.card{
    background:white;
    border-radius:10px;
    padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    border-left:4px solid #7a563b;
    min-height:100px;
}

.card h4{
    font-size:13px;
    color:#777;
    margin-bottom:8px;
}

.card h2{
    font-size:30px;
    color:#7a563b;
}

/* PANEL PRODUK */

.product-panel{
    margin-top:25px;
    background:white;
    border-radius:10px;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.product-panel-title{
    margin-bottom:15px;
}

.product-panel-title h3{
    font-size:20px;
    color:#222;
}

.product-form{
    display:grid;
    grid-template-columns:1.4fr 1fr 1fr 1.5fr 1.5fr auto;
    gap:10px;
    align-items:end;
}

.field label{
    display:block;
    font-size:11px;
    font-weight:bold;
    color:#666;
    margin-bottom:5px;
}

.product-form input,
.product-form select{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:6px;
    outline:none;
}

.product-form input:focus,
.product-form select:focus{
    border-color:#7a563b;
}

.btn-add-product{
    background:#7a563b;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    white-space:nowrap;
}

.upload-hint{
    display:block;
    margin-top:5px;
    color:#888;
    font-size:10px;
}

.file-preview{
    margin-top:12px;
    display:none;
    width:220px;
    max-height:150px;
    object-fit:contain;
    border:1px solid #eee;
    border-radius:6px;
    background:#fafafa;
}

.product-list{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:12px;
}

.admin-product-card{
    border:1px solid #eee;
    border-radius:8px;
    overflow:hidden;
    background:#fff;
}

.admin-product-card img{
    width:100%;
    height:130px;
    object-fit:cover;
    background:#eee;
}

.admin-product-info{
    padding:10px;
}

.admin-product-title{
    font-weight:bold;
    font-size:13px;
    margin-bottom:5px;
}

.admin-product-meta{
    color:#777;
    font-size:11px;
    margin-bottom:5px;
}

.admin-product-price{
    color:#7a563b;
    font-weight:bold;
    margin-bottom:8px;
}

.btn-delete-product{
    width:100%;
    background:#dc3545;
    color:white;
    border:none;
    padding:7px;
    border-radius:5px;
    cursor:pointer;
    font-size:11px;
}

/* CHECKOUT */

.table-box{
    margin-top:25px;
}

.table-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    gap:10px;
}

.table-title h3{
    font-size:22px;
    color:#222;
}

.delete{
    background:#dc3545;
    color:white;
    padding:9px 18px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:13px;
}

.table-wrapper{
    overflow-x:auto;
    border-radius:10px;
}

table{
    width:100%;
    min-width:1300px;
    border-collapse:collapse;
    background:white;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

thead{
    background:#fafafa;
}

thead th{
    padding:15px;
    text-align:left;
    font-size:13px;
    color:#444;
    border-bottom:1px solid #ddd;
    white-space:nowrap;
}

tbody td{
    padding:13px 15px;
    text-align:center;
    color:#555;
    border-bottom:1px solid #eee;
    vertical-align:middle;
    font-size:12px;
}

tbody tr:hover{
    background:#faf8f6;
}

.empty{
    padding:30px !important;
    color:#888 !important;
}

/* STATUS */

.status-select{
    border:1px solid #ccc;
    background:white;
    color:#6d472d;
    padding:7px 9px;
    border-radius:6px;
    cursor:pointer;
    font-size:11px;
    font-weight:bold;
    outline:none;
}

.status-badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:5px;
    font-size:10px;
    font-weight:bold;
    margin-bottom:6px;
}

.status-dikemas{
    background:#fff3cd;
    color:#856404;
}

.status-dikirim{
    background:#dbeafe;
    color:#1d4ed8;
}

.status-diterima{
    background:#d4edda;
    color:#155724;
}

/* PEMBAYARAN */

.payment-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    padding:6px 9px;
    border-radius:6px;
    font-size:10px;
    font-weight:bold;
    white-space:nowrap;
}

.payment-cod{
    background:#fff3cd;
    color:#856404;
}

.payment-bank{
    background:#dbeafe;
    color:#1d4ed8;
}

.payment-ewallet{
    background:#e8def8;
    color:#6b21a8;
}

.payment-qris{
    background:#d1fae5;
    color:#047857;
}

.payment-default{
    background:#eee;
    color:#555;
}

/* TOAST */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#7a563b;
    color:white;
    padding:13px 18px;
    border-radius:8px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
    opacity:0;
    transform:translateY(20px);
    pointer-events:none;
    transition:.3s;
    z-index:9999;
    font-size:13px;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

/* MOBILE */

@media(max-width:1200px){

    .product-form{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:900px){

    .cards{
        grid-template-columns:1fr;
    }

    .header{
        flex-direction:column;
        align-items:stretch;
    }

    .header-right{
        justify-content:center;
    }

    .table-title{
        flex-direction:column;
        align-items:flex-start;
    }

}

@media(max-width:600px){

    .container{
        width:95%;
    }

    .product-form{
        grid-template-columns:1fr;
    }

    .logo h1{
        font-size:17px;
    }

    .header-right{
        width:100%;
    }

    .header-right button{
        flex:1;
    }

}
</style>
</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="header">

    <div class="logo">

        <i class="fa-solid fa-user-shield"></i>

        <h1>
            Dashboard Admin Pisshop
        </h1>

    </div>

    <div class="header-right">

        <button
            class="btn logout"
            onclick="location.href='login.html'">

            <i class="fa-solid fa-right-from-bracket"></i>
            Logout

        </button>

        <button
            class="btn tutup"
            onclick="window.close()">

            Tutup

        </button>

    </div>

</div>


<!-- STATISTIK -->

<div class="cards">

    <div class="card">

        <h4>
            TOTAL PESANAN
        </h4>

        <h2 id="admTotalOrders">
            0
        </h2>

    </div>


    <div class="card">

        <h4>
            ITEM TERJUAL
        </h4>

        <h2 id="admTotalItems">
            0
        </h2>

    </div>


    <div class="card">

        <h4>
            TOTAL OMSET
        </h4>

        <h2
            id="admTotalRevenue"
            style="font-size:21px;">

            Rp 0

        </h2>

    </div>

</div>


<!-- MANAJEMEN PRODUK -->

<div class="product-panel">

    <div class="product-panel-title">

        <h3>

            <i class="fa-solid fa-box-open"></i>

            Tambah Produk

        </h3>

    </div>


    <form
        class="product-form"
        onsubmit="addProduct(event)">

        <div class="field">

            <label>
                Nama Produk
            </label>

            <input
                id="productName"
                type="text"
                placeholder="Contoh: Kaos Premium"
                required>

        </div>


        <div class="field">

            <label>
                Kategori
            </label>

            <select
                id="productCategory"
                required>

                <option value="Baju">
                    Baju
                </option>

                <option value="Sepatu">
                    Sepatu
                </option>

                <option value="Aksesoris">
                    Aksesoris
                </option>

                <option value="Tas">
                    Tas
                </option>

                <option value="Olahraga">
                    Olahraga
                </option>

                <option value="Elektronik">
                    Elektronik
                </option>

            </select>

        </div>


        <div class="field">

            <label>
                Harga
            </label>

            <input
                id="productPrice"
                type="number"
                min="1"
                placeholder="125000"
                required>

        </div>


        <div class="field">

            <label>
                Foto Produk
            </label>

            <input
                id="productImage"
                type="file"
                accept="image/*"
                required>

            <small class="upload-hint">
                Maksimal 2 MB
            </small>

        </div>


        <div class="field">

            <label>
                Video Produk
            </label>

            <input
                id="productVideo"
                type="file"
                accept="video/*">

            <small class="upload-hint">
                Opsional • Maksimal 6 MB
            </small>

        </div>


        <button
            class="btn-add-product"
            type="submit">

            <i class="fa-solid fa-plus"></i>

            Tambah Produk

        </button>

    </form>


    <img
        id="imagePreview"
        class="file-preview"
        alt="Preview">


    <video
        id="videoPreview"
        class="file-preview"
        controls>
    </video>


    <div
        id="adminProductList"
        class="product-list">
    </div>

</div>


<!-- DATA CHECKOUT -->

<div class="table-box">

    <div class="table-title">

        <h3>

            <i class="fa-solid fa-list"></i>

            Data Checkout Masuk

        </h3>


        <button
            class="delete"
            onclick="clearAllOrders()">

            <i class="fa-solid fa-trash"></i>

            Hapus Semua Data

        </button>

    </div>


    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Nama Pembeli</th>

                    <th>Telepon</th>

                    <th>Alamat</th>

                    <th>Produk</th>

                    <th>Qty</th>

                    <th>Total</th>

                    <th>Pembayaran</th>

                    <th>Waktu</th>

                    <th>Status</th>

                </tr>

            </thead>


            <tbody
                id="ordersTableBody">

            </tbody>

        </table>

    </div>

</div>

</div>


<!-- TOAST -->

<div
    id="toast"
    class="toast">

    Pesanan berhasil diperbarui.

</div>


<script>

/* ==================================================
   STORAGE KEY
================================================== */

const ORDER_STORAGE_KEY =
    "shopee_orders";

const PRODUCT_STORAGE_KEY =
    "pisshop_products";


/* ==================================================
   KEAMANAN HTML
================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeJS(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");

}


/* ==================================================
   PESANAN
================================================== */

function getOrders(){

    try{

        let orders =
            JSON.parse(
                localStorage.getItem(
                    ORDER_STORAGE_KEY
                )
            ) || [];

        if(!Array.isArray(orders)){
            orders=[];
        }

        let changed=false;

        orders=orders.map(order=>{

            if(!order.status){

                order.status="Dikemas";

                changed=true;

            }

            return order;

        });


        if(changed){

            localStorage.setItem(
                ORDER_STORAGE_KEY,
                JSON.stringify(orders)
            );

        }

        return orders;

    }catch(error){

        console.error(error);

        return [];

    }

}


/* ==================================================
   PAYMENT
================================================== */

function getPaymentHTML(payment){

    const value =
        String(
            payment ||
            "Belum dipilih"
        );

    const lower =
        value.toLowerCase();


    if(lower.includes("cod")){

        return `
        <span class="payment-badge payment-cod">
            💵 ${escapeHTML(value)}
        </span>
        `;

    }


    if(
        lower.includes("bank") ||
        lower.includes("transfer")
    ){

        return `
        <span class="payment-badge payment-bank">
            🏦 ${escapeHTML(value)}
        </span>
        `;

    }


    if(
        lower.includes("dana") ||
        lower.includes("gopay") ||
        lower.includes("ovo")
    ){

        return `
        <span class="payment-badge payment-ewallet">
            📱 ${escapeHTML(value)}
        </span>
        `;

    }


    if(lower.includes("qris")){

        return `
        <span class="payment-badge payment-qris">
            📲 ${escapeHTML(value)}
        </span>
        `;

    }


    return `
    <span class="payment-badge payment-default">
        ${escapeHTML(value)}
    </span>
    `;

}


/* ==================================================
   RENDER DASHBOARD
================================================== */

function renderAdminDashboard(){

    const orders =
        getOrders();


    let totalRevenue=0;

    let totalItems=0;


    orders.forEach(order=>{

        totalRevenue +=
            Number(order.total) || 0;

        totalItems +=
            Number(order.itemsCount) || 0;

    });


    document.getElementById(
        "admTotalOrders"
    ).innerText =
        orders.length;


    document.getElementById(
        "admTotalItems"
    ).innerText =
        totalItems;


    document.getElementById(
        "admTotalRevenue"
    ).innerText =
        "Rp " +
        totalRevenue.toLocaleString(
            "id-ID"
        );


    const tbody =
        document.getElementById(
            "ordersTableBody"
        );


    if(orders.length===0){

        tbody.innerHTML=`

        <tr>

            <td
                colspan="10"
                class="empty">

                <i
                    class="fa-solid fa-box-open"
                    style="
                    font-size:30px;
                    display:block;
                    margin-bottom:8px;
                    ">

                </i>

                Belum ada pesanan masuk.

            </td>

        </tr>

        `;

        return;

    }


    tbody.innerHTML =
        orders.map(order=>{

            const status =
                order.status ||
                "Dikemas";


            const statusClass =
                "status-" +
                status.toLowerCase();


            const payment =
                order.paymentMethod ||
                order.payment ||
                "Belum dipilih";


            return `

            <tr>

                <td>

                    <b>
                        ${escapeHTML(order.id)}
                    </b>

                </td>


                <td>

                    <b>
                        ${escapeHTML(order.buyer)}
                    </b>

                </td>


                <td>

                    ${escapeHTML(order.phone)}

                </td>


                <td
                    style="
                    max-width:200px;
                    white-space:normal;
                    ">

                    ${escapeHTML(order.address)}

                </td>


                <td>

                    ${escapeHTML(
                        order.productTitle
                    )}

                </td>


                <td>

                    ${Number(
                        order.itemsCount
                    ) || 0}x

                </td>


                <td>

                    <b
                        style="color:#7a563b;">

                        Rp ${
                            (
                                Number(
                                    order.total
                                ) || 0
                            ).toLocaleString(
                                "id-ID"
                            )
                        }

                    </b>

                </td>


                <td>

                    ${getPaymentHTML(payment)}

                </td>


                <td
                    style="
                    font-size:11px;
                    white-space:nowrap;
                    ">

                    ${escapeHTML(
                        order.time
                    )}

                </td>


                <td>

                    <span
                        class="
                        status-badge
                        ${statusClass}">

                        ${escapeHTML(status)}

                    </span>

                    <br>

                    <select
                        class="status-select"
                        onchange="
                        changeOrderStatus(
                            '${escapeJS(order.id)}',
                            this.value
                        )">

                        <option
                            value="Dikemas"
                            ${
                                status==="Dikemas"
                                ? "selected"
                                : ""
                            }>

                            📦 Dikemas

                        </option>

                        <option
                            value="Dikirim"
                            ${
                                status==="Dikirim"
                                ? "selected"
                                : ""
                            }>

                            🚚 Dikirim

                        </option>

                        <option
                            value="Diterima"
                            ${
                                status==="Diterima"
                                ? "selected"
                                : ""
                            }>

                            ✅ Diterima

                        </option>

                    </select>

                </td>

            </tr>

            `;

        }).join("");

}


/* ==================================================
   UBAH STATUS
================================================== */

function changeOrderStatus(
    orderId,
    newStatus
){

    const orders =
        getOrders();


    const order =
        orders.find(
            item =>
            String(item.id) ===
            String(orderId)
        );


    if(!order){

        alert(
            "Pesanan tidak ditemukan."
        );

        return;

    }


    order.status =
        newStatus;


    localStorage.setItem(
        ORDER_STORAGE_KEY,
        JSON.stringify(orders)
    );


    renderAdminDashboard();


    showToast(
        "Status pesanan " +
        order.id +
        " menjadi " +
        newStatus
    );

}


/* ==================================================
   HAPUS SEMUA PESANAN
================================================== */

function clearAllOrders(){

    const orders =
        getOrders();


    if(orders.length===0){

        alert(
            "Belum ada data pesanan."
        );

        return;

    }


    if(
        !confirm(
            "Yakin ingin menghapus semua data checkout?"
        )
    ){

        return;

    }


    localStorage.removeItem(
        ORDER_STORAGE_KEY
    );


    renderAdminDashboard();


    showToast(
        "Semua data checkout berhasil dihapus."
    );

}


/* ==================================================
   PRODUK ADMIN
================================================== */

function getAdminProducts(){

    try{

        const products =
            JSON.parse(
                localStorage.getItem(
                    PRODUCT_STORAGE_KEY
                )
            ) || [];

        return Array.isArray(products)
            ? products
            : [];

    }catch(error){

        return [];

    }

}


function saveAdminProducts(products){

    localStorage.setItem(
        PRODUCT_STORAGE_KEY,
        JSON.stringify(products)
    );

}


/* ==================================================
   FILE READER
================================================== */

function readFileAsDataURL(file){

    return new Promise(
        (resolve,reject)=>{

            const reader =
                new FileReader();


            reader.onload =
                () =>
                resolve(
                    reader.result
                );


            reader.onerror =
                () =>
                reject(
                    new Error(
                        "File gagal dibaca."
                    )
                );


            reader.readAsDataURL(file);

        }
    );

}


/* ==================================================
   TAMBAH PRODUK
================================================== */

async function addProduct(event){

    event.preventDefault();


    const name =
        document.getElementById(
            "productName"
        ).value.trim();


    const category =
        document.getElementById(
            "productCategory"
        ).value;


    const price =
        Number(
            document.getElementById(
                "productPrice"
            ).value
        );


    const imageFile =
        document.getElementById(
            "productImage"
        ).files[0];


    const videoFile =
        document.getElementById(
            "productVideo"
        ).files[0];


    if(
        !name ||
        !category ||
        !price ||
        !imageFile
    ){

        alert(
            "Nama, kategori, harga, dan foto wajib diisi."
        );

        return;

    }


    if(
        imageFile.size >
        2 * 1024 * 1024
    ){

        alert(
            "Foto maksimal 2 MB."
        );

        return;

    }


    if(
        videoFile &&
        videoFile.size >
        6 * 1024 * 1024
    ){

        alert(
            "Video maksimal 6 MB."
        );

        return;

    }


    const button =
        document.querySelector(
            ".btn-add-product"
        );


    button.disabled=true;

    button.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';


    try{

        const imageData =
            await readFileAsDataURL(
                imageFile
            );


        let videoData="";


        if(videoFile){

            videoData =
                await readFileAsDataURL(
                    videoFile
                );

        }


        const products =
            getAdminProducts();


        products.unshift({

            id:Date.now(),

            title:name,

            category:category,

            price:price,

            img:imageData,

            video:videoData

        });


        saveAdminProducts(
            products
        );


        document.getElementById(
            "productName"
        ).value="";


        document.getElementById(
            "productPrice"
        ).value="";


        document.getElementById(
            "productImage"
        ).value="";


        document.getElementById(
            "productVideo"
        ).value="";


        document.getElementById(
            "imagePreview"
        ).style.display="none";


        const videoPreview =
            document.getElementById(
                "videoPreview"
            );


        videoPreview.pause();

        videoPreview.removeAttribute(
            "src"
        );

        videoPreview.load();

        videoPreview.style.display=
            "none";


        renderAdminProducts();


        showToast(
            "Produk berhasil ditambahkan."
        );


    }catch(error){

        console.error(error);

        alert(
            "Gagal menyimpan produk."
        );

    }


    button.disabled=false;

    button.innerHTML =
        '<i class="fa-solid fa-plus"></i> Tambah Produk';

}


/* ==================================================
   RENDER PRODUK
================================================== */

function renderAdminProducts(){

    const container =
        document.getElementById(
            "adminProductList"
        );


    const products =
        getAdminProducts();


    if(products.length===0){

        container.innerHTML=`

            <div
                style="
                color:#888;
                text-align:center;
                padding:15px;
                grid-column:1/-1;
                ">

                Belum ada produk tambahan.

            </div>

        `;

        return;

    }


    container.innerHTML =
        products.map(product=>`

        <div class="admin-product-card">

            <img
                src="${escapeHTML(product.img)}"
                alt="${escapeHTML(product.title)}">


            <div class="admin-product-info">

                <div class="admin-product-title">

                    ${escapeHTML(
                        product.title
                    )}

                </div>


                <div class="admin-product-meta">

                    Kategori:
                    ${escapeHTML(
                        product.category
                    )}

                </div>


                <div class="admin-product-price">

                    Rp ${
                        Number(
                            product.price
                        ).toLocaleString(
                            "id-ID"
                        )
                    }

                </div>


                <div
                    class="admin-product-meta">

                    <i class="fa-solid fa-image"></i>

                    Foto tersimpan

                    ${
                        product.video
                        ?
                        " • 🎥 Video tersimpan"
                        :
                        " • Tanpa video"
                    }

                </div>


                <button
                    class="btn-delete-product"
                    onclick="
                    deleteProduct(
                        ${Number(product.id)}
                    )">

                    <i
                        class="fa-solid fa-trash">
                    </i>

                    Hapus Produk

                </button>

            </div>

        </div>

        `).join("");

}


/* ==================================================
   HAPUS PRODUK
================================================== */

function deleteProduct(productId){

    const products =
        getAdminProducts();


    const product =
        products.find(
            item =>
            Number(item.id) ===
            Number(productId)
        );


    if(!product)
        return;


    if(
        !confirm(
            'Hapus produk "' +
            product.title +
            '"?'
        )
    ){

        return;

    }


    const filtered =
        products.filter(
            item =>
            Number(item.id) !==
            Number(productId)
        );


    saveAdminProducts(
        filtered
    );


    renderAdminProducts();


    showToast(
        "Produk berhasil dihapus."
    );

}


/* ==================================================
   PREVIEW FOTO & VIDEO
================================================== */

function setupFilePreview(){

    const imageInput =
        document.getElementById(
            "productImage"
        );


    const videoInput =
        document.getElementById(
            "productVideo"
        );


    imageInput.addEventListener(
        "change",
        async function(){

            const file =
                this.files[0];


            const preview =
                document.getElementById(
                    "imagePreview"
                );


            if(!file){

                preview.style.display=
                    "none";

                return;

            }


            if(
                file.size >
                2 * 1024 * 1024
            ){

                alert(
                    "Foto maksimal 2 MB."
                );

                this.value="";

                preview.style.display=
                    "none";

                return;

            }


            preview.src =
                await readFileAsDataURL(
                    file
                );


            preview.style.display=
                "block";

        }
    );


    videoInput.addEventListener(
        "change",
        async function(){

            const file =
                this.files[0];


            const preview =
                document.getElementById(
                    "videoPreview"
                );


            if(!file){

                preview.style.display=
                    "none";

                return;

            }


            if(
                file.size >
                6 * 1024 * 1024
            ){

                alert(
                    "Video maksimal 6 MB."
                );

                this.value="";

                preview.style.display=
                    "none";

                return;

            }


            preview.src =
                await readFileAsDataURL(
                    file
                );


            preview.style.display=
                "block";

        }
    );

}


/* ==================================================
   TOAST
================================================== */

let toastTimer;


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.innerText =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            ()=>{
                toast.classList.remove(
                    "show"
                );
            },
            3000
        );

}


/* ==================================================
   REAL-TIME STORAGE EVENT
================================================== */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key ===
            ORDER_STORAGE_KEY
        ){

            renderAdminDashboard();

            showToast(
                "Pesanan baru masuk!"
            );

        }


        if(
            event.key ===
            PRODUCT_STORAGE_KEY
        ){

            renderAdminProducts();

        }

    }
);


/* ==================================================
   CEK OTOMATIS
   BERGUNA JIKA STORAGE EVENT TIDAK TERPICU
================================================== */

let lastOrdersData =
    localStorage.getItem(
        ORDER_STORAGE_KEY
    ) || "[]";


setInterval(
    function(){

        const currentOrdersData =
            localStorage.getItem(
                ORDER_STORAGE_KEY
            ) || "[]";


        if(
            currentOrdersData !==
            lastOrdersData
        ){

            lastOrdersData =
                currentOrdersData;


            renderAdminDashboard();

        }

    },
    1000
);


/* ==================================================
   START
================================================== */

window.addEventListener(
    "load",
    function(){

        renderAdminDashboard();

        renderAdminProducts();

        setupFilePreview();

    }
);

</script>
